    <script>
      (function () {
        const origDefineProperty = Object.defineProperty;
        Object.defineProperty = function (obj, prop, descriptor) {
          if (obj === window && (prop === "ethereum" || prop === "solana")) {
            try {
              const existing = Object.getOwnPropertyDescriptor(window, prop);
              if (existing && !existing.configurable) {
                return obj;
              }
            } catch (e) {
              return obj;
            }
          }
          try {
            return origDefineProperty.call(Object, obj, prop, descriptor);
          } catch (e) {
            if (prop === "ethereum" || prop === "solana") return obj;
            throw e;
          }
        };
      })();
    </script>
